        body {

          display: flex;

          height: 100vh;

        .form-container {

          border-radius: 10px;
          font-size: 1rem;
          transition: border 0.3s;
        }
    
        input:focus, textarea:focus {

        button {

          background-color: #2575fc;

          font-weight: bold;
          border: none;
          border-radius: 10px;
          cursor: pointer;
          font-size: 1rem;
          transition: background-color 0.3s;
        }
    
        button:hover {

        }
